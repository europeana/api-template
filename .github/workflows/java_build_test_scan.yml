# This workflow will build a Java project with Maven and cache/restore any dependencies to improve the workflow execution
# time. Then it will do a Sonar analysis and finally do a Grype scan of either the project files or the project's Docker
# image (new image will be built as part of the job).

# Known issue: sometimes the Setup JDK will start to complain about "Cache not found for keys: <cache-id>" even though
# a cache with the specified id is available. The solution is to delete the cache and let it be automatically recreated

name: Build, Run Tests and do Sonar and Grype analysis

on:
  workflow_call:
    inputs:
      java-version:
        description: 'JDK version to use'
        type: number
        required: false
        default: 21
      scan-docker:
        description: 'Generate and scan Docker image'
        type: boolean
        required: false
        default: true

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    # Permissions key is required for CodeQL SARIF Upload, per the docs:
    # https://docs.github.com/en/code-security/code-scanning/integrating-with-code-scanning/uploading-a-sarif-file-to-github
    permissions:
      security-events: write

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # Disabling shallow clones is recommended for improving the relevancy of reporting
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          architecture: x64
          cache: maven

      - name: Setup Maven
        # TODO this plugin is not maintained anymore and we need to find a replacement
        uses: whelk-io/maven-settings-xml-action@9dc09b23833fa9aa7f27b63db287951856f3433d # v.
        # see: https://github.com/europeana/europeana-parent-pom/blob/master/settings.xml
        with:
          repositories: '[{ "id": "europeana-libs-release", "url": "https://artifactory-prod.eanadev.org/artifactory/libs-release"}, 
                         { "id": "europeana-libs-snapshot", "url": "https://artifactory-prod.eanadev.org/artifactory/libs-snapshot", "snapshots": { "enabled": "true" }}]'
          plugin_repositories: '[{ "id": "europeana-plugins-release", "url": "https://artifactory-prod.eanadev.org/artifactory/plugins-release" },  
                                { "id": "europeana-plugins-snapshot", "url": "https://artifactory-prod.eanadev.org/artifactory/plugins-snapshot", "snapshots": { "enabled": "true" }}]'

      # TODO modify so we can run integration tests (safely!)?
      - name: Build and test with Maven (with code coverage)
        run: mvn -B jacoco:prepare-agent verify jacoco:report -DskipITs --file pom.xml

      - name: Upload generated jar/war as "output"
        uses: actions/upload-artifact@v7
        with:
          name: output
          # Make build jar/war available as job result
          path: ./**/target/*.[jw]ar
          retention-days: 1

      - name: SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.API_SONAR_TOKEN }}
        run: mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar


      # Build the Docker container so we can do a complete Grype scan of it
      - name: Build the Docker container
        if: inputs.scan-docker == true
        run: docker build . --file Dockerfile --tag localbuild/imagetoscan:latest

      - name: Grype scan of Docker container
        if: inputs.scan-docker == true
        id: grype-scan-docker
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: "localbuild/imagetoscan:latest"
          cache-db: true
          fail-build: false         # Disabled so we can upload a report
          severity-cutoff: critical

      - name: Grype scan of project files
        if: inputs.scan-docker == false
        id: grype-scan-project
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: "."
          cache-db: true
          fail-build: false         # Disabled so we can upload a report
          severity-cutoff: critical

      # Scan results are visible to Europeana staff with write access to the repo.
      # See GitHub's UI "Security and quality -> Code scanning". Don't forget to select the specific branch
      # you're working in (default view only shows master branch)
      - name: Upload Grype scan report for Docker
        if: inputs.scan-docker == true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype-scan-docker.outputs.sarif }}

      - name: Upload Grype scan report for project
        if: inputs.scan-docker == false
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype-scan-project.outputs.sarif }}
