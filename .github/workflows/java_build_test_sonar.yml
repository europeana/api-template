# This workflow will build a Java project with Maven and cache/restore any dependencies to improve the workflow execution time
# Then it will do a Sonar analysis and finally also run the Dependency Checker. The result of the Depedency Checker is available
# as an artifact.

# Known issue: sometimes the Setup JDK will start to complain about "Cache not found for keys: <cache-id>" even though
# a cache with the specified id is available. The solution is to delete the cache and let it be automatically recreated

name: Build, Run Tests and do Sonar Analysis

on: push

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # Disabling shallow clones is recommended for improving the relevancy of reporting
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Configure maven settings
        uses: whelk-io/maven-settings-xml-action@v22
        # see: https://github.com/europeana/europeana-parent-pom/blob/master/settings.xml
        with:
          repositories: '[{ "id": "europeana-libs-release", "url": "https://artifactory.eanadev.org/artifactory/libs-release"}, 
            { "id": "europeana-libs-snapshot", "url": "https://artifactory.eanadev.org/artifactory/libs-snapshot", "snapshots": { "enabled": "true" }}]'
          plugin_repositories: '[{ "id": "europeana-plugins-release", "url": "https://artifactory.eanadev.org/artifactory/plugins-release" },  
            { "id": "europeana-plugins-snapshot", "url": "https://artifactory.eanadev.org/artifactory/plugins-snapshot", "snapshots": { "enabled": "true" }}]'

      - name: Build and test with Maven
        run: mvn -B verify --file pom.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.API_SONAR_TOKEN }}

      # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v4

      - name: Dependency Checker
        uses: dependency-check/Dependency-Check_Action@main
        id: Depcheck
        env:
          # actions/setup-java changes JAVA_HOME, so it needs to be reset to match the depcheck image
          JAVA_HOME: /opt/jdk
        with:
          project: ${{ github.repository }}
          format: 'HTML'
          args: >
            --failOnCVSS 8
            --enableRetired
      - name: Upload Dependency Checker results
        uses: actions/upload-artifact@master
        with:
          name: Depcheck report
          path: ${{github.workspace}}/reports

