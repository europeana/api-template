apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-template-deployment
spec:
  # selector.matchLabels is provided via Kustomize
  template:
    spec:
      containers:
        - name: api-template
          image: europeana/api-template
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              port: 8080
              path: /actuator/health/liveness
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              port: 8080
              path: /actuator/health/readiness
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: secret
              mountPath: "/usr/local/tomcat/webapps/ROOT/WEB-INF/classes/myapi.user.properties"
              readOnly: true
              subPath: myapi.user.properties
      volumes:
        - name: secret
          secret:
            secretName: api-template-secret